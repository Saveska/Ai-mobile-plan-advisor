<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Google Sheets -->
  <rect x="20" y="40" width="150" height="60" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="95" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Google Sheets</text>
  <text x="95" y="86" text-anchor="middle" font-size="12" fill="#14532d">plan data</text>

  <!-- Power Apps -->
  <rect x="20" y="190" width="150" height="70" rx="10" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="95" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#3b0764">Power Apps</text>
  <text x="95" y="240" text-anchor="middle" font-size="12" fill="#3b0764">user interface</text>

  <!-- Flows -->
  <rect x="250" y="100" width="180" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="340" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">Power Automate</text>
  <text x="340" y="146" text-anchor="middle" font-size="12" fill="#0c4a6e">SendDataToScript</text>

  <rect x="250" y="290" width="180" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="340" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">Power Automate</text>
  <text x="340" y="336" text-anchor="middle" font-size="12" fill="#0c4a6e">SendEmailToScript</text>

  <!-- Flask -->
  <rect x="540" y="185" width="150" height="80" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="615" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#713f12">Flask API</text>
  <text x="615" y="240" text-anchor="middle" font-size="12" fill="#713f12">Python</text>

  <!-- Groq -->
  <rect x="780" y="50" width="160" height="70" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="860" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">Groq API</text>
  <text x="860" y="98" text-anchor="middle" font-size="12" fill="#7c2d12">llama-3.1-8b-instant</text>

  <!-- ReportLab -->
  <rect x="780" y="190" width="160" height="70" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="860" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">ReportLab</text>
  <text x="860" y="238" text-anchor="middle" font-size="12" fill="#7f1d1d">PDF report</text>

  <!-- Email -->
  <rect x="780" y="330" width="160" height="70" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="860" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">User's inbox</text>
  <text x="860" y="378" text-anchor="middle" font-size="12" fill="#0f172a">sent over SMTP</text>

  <!-- Arrows -->
  <line x1="95" y1="100" x2="95" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="170" y1="210" x2="248" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="170" y1="240" x2="248" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="140" x2="538" y2="208" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="310" x2="538" y2="243" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="690" y1="205" x2="778" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="690" y1="225" x2="778" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="690" y1="248" x2="778" y2="350" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Labels -->
  <text x="500" y="150" text-anchor="middle" font-size="11" fill="#334155" transform="rotate(32 500 150)">POST /generate_pdf</text>
  <text x="500" y="300" text-anchor="middle" font-size="11" fill="#334155" transform="rotate(-32 500 300)">POST /send_email</text>
  <text x="705" y="140" text-anchor="middle" font-size="11" fill="#334155" transform="rotate(-48 705 140)">prompt and analysis</text>
  <text x="735" y="217" text-anchor="middle" font-size="11" fill="#334155">builds</text>
  <text x="735" y="320" text-anchor="middle" font-size="11" fill="#334155" transform="rotate(48 735 320)">email with PDF</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
